# iPhone builds of the customer and delivery-partner apps. Run by hand: Actions → iPhone app → Run workflow.
#
#  simulator – builds an app for the iPhone Simulator on a Mac (Xcode). No Apple account needed.
#              Download the "…-ios-simulator" artifact, unzip, and drag the .app onto a running Simulator.
#  device    – builds a real iPhone app with Expo EAS (needs an Apple Developer account and the
#              EXPO_TOKEN repository secret; set up once with `npx eas-cli build:configure`).
name: iPhone app

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'simulator (test on a Mac) or device (real iPhone, needs Apple Developer account + EXPO_TOKEN)'
        type: choice
        options: [simulator, device]
        default: simulator
      app:
        description: 'Which app'
        type: choice
        options: [customer, rider]
        default: customer

jobs:
  simulator:
    if: ${{ inputs.target == 'simulator' }}
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile/${{ inputs.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Use the website's settings
        working-directory: .
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          URL="${API_URL:-$(node -p "require('./mobile/app-config.json').api_url" 2>/dev/null || echo https://wownaturals.in)}"
          URL="${URL%/}"
          if curl -fsS --max-time 20 "$URL/api/v1/app-config" -o /tmp/app-config.json && node -e "const c=JSON.parse(require('fs').readFileSync('/tmp/app-config.json'));if(!c.api_url)process.exit(1)"; then
            cp /tmp/app-config.json mobile/app-config.json
          fi
      - name: Install packages
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix
      - name: Generate native iPhone project
        run: npx expo prebuild --platform ios --clean
      - name: Build for the iPhone Simulator
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(xcodebuild -list -json -workspace "$WS" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(j.workspace.schemes.find(x=>!/^Pods|^Expo|^React|^RN/.test(x))||j.workspace.schemes[0])})")
          echo "Workspace $WS, scheme $SCHEME"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tail -40
          APP=$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -1)
          mkdir -p ../../dist && (cd "$(dirname "$APP")" && zip -qry "$GITHUB_WORKSPACE/dist/daily-table-${{ inputs.app }}-ios-simulator.zip" "$(basename "$APP")")
      - uses: actions/upload-artifact@v4
        with:
          name: daily-table-${{ inputs.app }}-ios-simulator
          path: dist/*.zip

  device:
    if: ${{ inputs.target == 'device' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/${{ inputs.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check the Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN secret (expo.dev → Access tokens) and an Apple Developer account in EAS first."
            exit 1
          fi
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Build on Expo EAS (iPhone)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest build --platform ios --profile production --non-interactive --no-wait
