# After "Android APK" finishes, put both APKs on the `apk` branch (one commit, replaced each time),
# so they can also be fetched with plain git. Can be run by hand for any build run id.
name: Publish APKs to branch

on:
  workflow_run:
    workflows: ['Android APK']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id of the "Android APK" build'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: apk
          merge-multiple: true
          run-id: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit APKs to the apk branch
        run: |
          ls -lh apk
          cd apk
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# Daily Table APKs\n\nBuilt from %s on %s.\n\n- daily-table-customer.apk: customer app\n- daily-table-rider.apk: delivery partner app\n' "${{ github.event.workflow_run.head_sha || github.sha }}" "$(date -u +'%Y-%m-%d %H:%M UTC')" > README.md
          git add -A
          git commit -q -m "APKs from build ${{ github.event.inputs.run_id || github.event.workflow_run.id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
