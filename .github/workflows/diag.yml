# Diagnostics: install the published APKs on an Android emulator, open them, and save the crash log.
name: Crash test
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Get APKs
        run: |
          git init -q apks && cd apks
          git fetch -q --depth 1 "https://github.com/${{ github.repository }}.git" apk
          git checkout -q FETCH_HEAD && ls -la
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash -c 'mkdir -p out; for p in "in.dailytable.app:daily-table-customer.apk" "in.dailytable.rider:daily-table-rider.apk"; do pkg=${p%%:*}; apk=${p##*:}; adb install -r -g apks/$apk > out/$pkg-install.txt 2>&1; adb logcat -c; adb shell monkey -p $pkg -c android.intent.category.LAUNCHER 1 > /dev/null 2>&1; sleep 25; echo "pid: $(adb shell pidof $pkg)" > out/$pkg-status.txt; adb shell dumpsys activity activities | grep -i "mResumedActivity\|topResumedActivity" >> out/$pkg-status.txt; adb logcat -d -v time > out/$pkg-logcat-full.txt; grep -E "AndroidRuntime|FATAL|ReactNativeJS|ReactNative|Expo|expo|Error|Exception|$pkg" out/$pkg-logcat-full.txt | grep -v "chatty" | tail -400 > out/$pkg-logcat.txt; adb exec-out screencap -p > out/$pkg-screen.png; done; ls -la out'
      - name: Save results
        if: always()
        run: |
          mkdir -p res && cp -r out/* res/ 2>/dev/null || true
          cd res && git init -q -b diag-logs && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "crash test ${{ github.run_id }}" && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" diag-logs
