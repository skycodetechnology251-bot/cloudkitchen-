# Diagnostics: install the published APKs on an Android emulator, open them, and save the crash log.
name: Crash test
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v5
      - name: Get APKs
        run: |
          git init -q apks && cd apks
          git fetch -q --depth 1 "https://github.com/${{ github.repository }}.git" apk
          git checkout -q FETCH_HEAD && ls -la
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash diag.sh
      - name: Save results
        if: always()
        run: |
          mkdir -p res && cp -r out/* res/ 2>/dev/null || true
          cd res && git init -q -b diag-logs && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "crash test ${{ github.run_id }}" && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" diag-logs
